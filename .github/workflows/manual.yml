name: Manual comparison (one-time approval)
on:
  workflow_dispatch:
    inputs:
      run_approved:
        description: 'I authorize this one run; it uses GitHub Actions included minutes'
        required: true
        type: boolean
        default: false
      live:
        description: 'Also attempt public merchant pages (no purchases)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    if: ${{ inputs.run_approved }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - if: ${{ inputs.live }}
        run: python -m hunter.cli --out reports/live
      - uses: actions/upload-artifact@v4
        with:
          name: comparison-reports
          path: reports/
          retention-days: 1
