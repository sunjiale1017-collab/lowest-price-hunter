name: Manual comparison (one-time approval)
on:
  workflow_dispatch:
    inputs:
      run_approved:
        description: 'I authorize this single run (uses GitHub Actions minutes)'
        required: true
        type: boolean
        default: false
      live:
        description: 'Search public merchant pages (without purchasing)'
        type: boolean
        default: false
      product_model:
        description: 'Optional exact model/SKU for NL-DE-BE search; blank tests default AEG target'
        required: false
        type: string
        default: ''
permissions:
  contents: read
jobs:
  check:
    if: ${{ inputs.run_approved }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Collect product price evidence (public sites only)
        if: ${{ inputs.live }}
        env:
          PRODUCT_MODEL: ${{ inputs.product_model }}
        run: |
          if [ -n "$PRODUCT_MODEL" ]; then
            python -m hunter.cli --config config/europe.json --model "$PRODUCT_MODEL" --out reports/live
          else
            python -m hunter.cli --config config/aeg.json --out reports/live
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: comparison-reports
          path: reports/
          retention-days: 1
